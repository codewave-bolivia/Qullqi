# CD: after a pull request is merged into develop, build the signed release APK from the
# resulting develop commit and publish it as a GitHub pre-release (CLAUDE.md §16).
# Runs on develop; pushes to develop that do not come from a merged pull request publish nothing.
# Never touches master.
#
# Required repository secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD keystore password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
name: Develop release

on:
  push:
    branches: [develop]

concurrency:
  group: develop-release
  cancel-in-progress: false

jobs:
  guard:
    name: Find merged pull request
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.pr.outputs.number }}
      pr_title: ${{ steps.pr.outputs.title }}
    steps:
      - id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # GitHub links the merge commit to its pull request a few seconds after the push:
          # retry for up to ~2 minutes before concluding it is not a PR merge.
          pr=""
          for attempt in 1 2 3 4 5 6 7 8; do
            pr=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
              --jq '[.[] | select(.merged_at != null and .base.ref == "develop"
                      and .merge_commit_sha == "${{ github.sha }}")][0] // empty')
            [[ -n $pr ]] && break
            echo "No merged pull request linked yet (attempt $attempt); retrying in 15s"
            sleep 15
          done
          if [[ -z $pr ]]; then
            echo "::notice::${{ github.sha }} is not the result of a merged pull request; no release."
            exit 0
          fi
          echo "number=$(jq -r .number <<<"$pr")" >> "$GITHUB_OUTPUT"
          { echo "title<<__EOF__"; jq -r .title <<<"$pr"; echo "__EOF__"; } >> "$GITHUB_OUTPUT"

  release:
    name: Build and publish release APK
    needs: guard
    if: needs.guard.outputs.pr_number != ''
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    env:
      TAG: develop-build-${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (unsigned)
        run: ./gradlew :androidApp:assembleRelease --no-configuration-cache

      - name: Sign APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for v in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            [[ -n ${!v} ]] || { echo "::error::Missing secret for $v (see workflow header)"; exit 1; }
          done
          ks="$RUNNER_TEMP/release.keystore"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ks"
          bt=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          unsigned=$(ls androidApp/build/outputs/apk/release/*-unsigned.apk)
          out="$RUNNER_TEMP/qullqi-${TAG}.apk"
          "$bt/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" sign --ks "$ks" --ks-pass env:KEYSTORE_PASSWORD \
            --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD \
            --out "$out" "$RUNNER_TEMP/aligned.apk"
          "$bt/apksigner" verify "$out"
          rm -f "$ks"
          echo "APK=$out" >> "$GITHUB_ENV"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ needs.guard.outputs.pr_number }}
          PR_TITLE: ${{ needs.guard.outputs.pr_title }}
        run: |
          gh release create "$TAG" "$APK" \
            --target "${{ github.sha }}" \
            --prerelease \
            --title "Develop build ${{ github.run_number }}" \
            --notes "Release APK from develop (${GITHUB_SHA::7}) after merging #${PR_NUMBER}: ${PR_TITLE}"
